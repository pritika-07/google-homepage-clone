
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive Google homepage clone built with HTML, CSS and JavaScript.">
  <title>Google</title>
  <link rel="icon" href="https://www.google.com/favicon.ico">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="topbar">
    <nav class="top-links" aria-label="Main navigation">
      <a href="https://mail.google.com/" target="_blank" rel="noopener noreferrer">Gmail</a>
      <a href="https://images.google.com/" target="_blank" rel="noopener noreferrer">Images</a>

      <button class="apps-button" id="apps-button"
        aria-label="Google apps" aria-expanded="false" title="Google apps">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="5" r="1.7"/>
          <circle cx="12" cy="5" r="1.7"/>
          <circle cx="19" cy="5" r="1.7"/>
          <circle cx="5" cy="12" r="1.7"/>
          <circle cx="12" cy="12" r="1.7"/>
          <circle cx="19" cy="12" r="1.7"/>
          <circle cx="5" cy="19" r="1.7"/>
          <circle cx="12" cy="19" r="1.7"/>
          <circle cx="19" cy="19" r="1.7"/>
        </svg>
      </button>

      <a class="profile" href="https://myaccount.google.com/"
        target="_blank" rel="noopener noreferrer" aria-label="Google account">
        P
      </a>
    </nav>

    <div class="apps-menu" id="apps-menu" hidden>
      <a href="https://www.google.com/" target="_blank" rel="noopener noreferrer">
        <span class="app-icon google-icon">G</span>
        <span>Search</span>
      </a>
      <a href="https://mail.google.com/" target="_blank" rel="noopener noreferrer">
        <span class="app-icon mail-icon">M</span>
        <span>Gmail</span>
      </a>
      <a href="https://maps.google.com/" target="_blank" rel="noopener noreferrer">
        <span class="app-icon maps-icon">↗</span>
        <span>Maps</span>
      </a>
      <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer">
        <span class="app-icon youtube-icon">▶</span>
        <span>YouTube</span>
      </a>
      <a href="https://drive.google.com/" target="_blank" rel="noopener noreferrer">
        <span class="app-icon drive-icon">△</span>
        <span>Drive</span>
      </a>
      <a href="https://calendar.google.com/" target="_blank" rel="noopener noreferrer">
        <span class="app-icon calendar-icon">31</span>
        <span>Calendar</span>
      </a>
    </div>
  </header>

  <main class="main-content">
    <section class="search-section" aria-label="Google search">
      <a class="google-logo" href="https://www.google.com/" aria-label="Google home">
        <span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span>
      </a>

      <form id="search-form" role="search">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="10.8" cy="10.8" r="6.8"/>
            <path d="m16 16 4.5 4.5"/>
          </svg>

          <input
            type="text"
            id="search-input"
            name="q"
            aria-label="Search Google"
            autocomplete="off"
            spellcheck="false"
          >

          <button type="button" id="clear-button"
            class="icon-button clear-button" aria-label="Clear search" hidden>
            ×
          </button>

          <button type="button" class="icon-button" id="voice-button"
            aria-label="Voice search demo" title="Voice search">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="12" rx="3"/>
              <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/>
            </svg>
          </button>
        </div>

        <div class="search-actions">
          <button type="submit" class="search-button">Google Search</button>
          <button type="button" id="lucky-button" class="search-button">
            I'm Feeling Lucky
          </button>
        </div>
      </form>

      <p class="language-line">
        Google offered in:
        <a href="https://www.google.com/?hl=hi">हिन्दी</a>
        <a href="https://www.google.com/?hl=bn">বাংলা</a>
        <a href="https://www.google.com/?hl=te">తెలుగు</a>
        <a href="https://www.google.com/?hl=ta">தமிழ்</a>
        <a href="https://www.google.com/?hl=mr">मराठी</a>
      </p>

      <p class="notice" id="notice" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="footer">
    <div class="country">India</div>

    <div class="footer-bottom">
      <div class="footer-group">
        <a href="https://about.google/">About</a>
        <a href="https://ads.google.com/">Advertising</a>
        <a href="https://www.google.com/services/">Business</a>
        <a href="https://www.google.com/search/howsearchworks/">How Search works</a>
      </div>

      <a class="carbon-link" href="https://sustainability.google/">
        <span class="leaf">♧</span> Our third decade of climate action
      </a>

      <div class="footer-group">
        <a href="https://policies.google.com/privacy">Privacy</a>
        <a href="https://policies.google.com/terms">Terms</a>
        <button id="settings-button" class="footer-button">Settings</button>
      </div>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
